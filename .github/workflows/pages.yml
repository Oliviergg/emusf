name: GitHub Pages — REPL Pyodide

# Publie pyodide/dist/ (page + bundle emusf) sur GitHub Pages.
# L'étape configure-pages active Pages automatiquement au premier run ;
# si elle échoue (droits), activer une fois à la main :
# Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire le site (bundle emusf + shim + antlr4)
        run: python pyodide/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pyodide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
