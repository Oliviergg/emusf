<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}emusf{% endblock %} — Salesforce Viewer</title>
    <link rel="stylesheet" href="/static/slds/styles/salesforce-lightning-design-system.min.css">
    <style>
        :root {
            --nav-bg: #032d60;
            --nav-active-border: #1589ee;
        }
        * { box-sizing: border-box; }
        body { background: #f3f3f3; margin: 0; }
        .app-container { min-height: 100vh; display: flex; flex-direction: column; }

        /* === Global Nav (SF One App style) === */
        .sf-global-nav {
            background: var(--nav-bg);
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            position: sticky; top: 0; z-index: 100;
        }
        .sf-nav-brand {
            color: white; font-size: 1.1rem; font-weight: 800;
            text-decoration: none; margin-right: 0.25rem; padding: 0 0.75rem;
            letter-spacing: 0.3px;
        }
        .sf-nav-items { display: flex; height: 100%; align-items: stretch; flex: 1; }
        .sf-nav-item {
            color: rgba(255,255,255,0.85); text-decoration: none;
            font-size: 0.8125rem; font-weight: 400;
            padding: 0 0.875rem; display: flex; align-items: center;
            border-bottom: 3px solid transparent;
            transition: background 0.15s, border-color 0.15s;
        }
        .sf-nav-item:hover { background: rgba(255,255,255,0.08); color: white; border-bottom-color: rgba(255,255,255,0.4); }
        .sf-nav-item.active { color: white; font-weight: 700; border-bottom-color: var(--nav-active-border); }
        .sf-nav-search { margin-left: auto; display: flex; align-items: center; }
        .sf-nav-search input {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
            border-radius: 4px; color: white; padding: 4px 10px 4px 28px;
            font-size: 0.8rem; width: 220px; outline: none;
        }
        .sf-nav-search input::placeholder { color: rgba(255,255,255,0.55); }
        .sf-nav-search input:focus { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        .sf-nav-search-wrap { position: relative; }
        .sf-nav-search-wrap .search-icon {
            position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; fill: rgba(255,255,255,0.5); pointer-events: none;
        }

        /* === Page === */
        .page-content { max-width: 1280px; margin: 0 auto; padding: 0.75rem 1rem; flex: 1; }

        /* === Record Detail — SF Lightning fields === */
        .sf-field {
            padding: 0.375rem 0.75rem;
            min-height: 3.25rem;
        }
        .sf-field-label {
            font-size: 0.75rem; color: #444746; font-weight: 400;
            margin-bottom: 1px; line-height: 1.25;
        }
        .sf-field-value {
            font-size: 0.8125rem; color: #080707; line-height: 1.5;
            word-break: break-word;
        }
        .sf-field-value a { color: #0176d3; text-decoration: none; }
        .sf-field-value a:hover { text-decoration: underline; }
        .sf-field-empty { color: #b0adab; }
        .badge-required {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #c23934; margin-right: 3px; vertical-align: middle;
        }

        /* === Sections (collapsible, SF-like) === */
        .sf-section {
            background: white; border: 1px solid #e5e5e5;
            border-radius: 4px; margin-bottom: 0.75rem;
        }
        .sf-section-header {
            padding: 0.75rem; font-size: 0.875rem; font-weight: 700; color: #080707;
            border-bottom: 1px solid #e5e5e5; cursor: pointer;
            display: flex; align-items: center; gap: 0.5rem; user-select: none;
        }
        .sf-section-header .chevron {
            width: 12px; height: 12px; transition: transform 0.15s; fill: #706e6b; flex-shrink: 0;
        }
        .sf-section.collapsed .sf-section-body { display: none; }
        .sf-section.collapsed .chevron { transform: rotate(-90deg); }
        .sf-section-grid {
            display: grid; grid-template-columns: 1fr 1fr;
        }
        .sf-section-grid > div:first-child { border-right: 1px solid #e5e5e5; }
        .sf-section-grid .sf-field { border-bottom: 1px solid #f3f3f3; }
        .sf-section-grid .sf-field:last-child { border-bottom: none; }

        /* === Tabs (SF Lightning) === */
        .sf-tabs {
            display: flex; border-bottom: 3px solid #dddbda;
            margin-bottom: 0.75rem; background: white;
            padding: 0 0.75rem; border-radius: 4px 4px 0 0;
        }
        .sf-tab {
            padding: 0.75rem 1rem; font-size: 0.8125rem; font-weight: 600;
            color: #706e6b; text-decoration: none;
            border-bottom: 3px solid transparent; margin-bottom: -3px; cursor: pointer;
        }
        .sf-tab:hover { color: #0176d3; }
        .sf-tab.active { color: #0176d3; border-bottom-color: #0176d3; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* === Record Header (Lightning highlights panel) === */
        .sf-record-header {
            background: white; border: 1px solid #e5e5e5; border-radius: 4px;
            padding: 1rem 1.25rem; margin-bottom: 0;
            display: flex; align-items: flex-start; gap: 1rem;
        }
        .sf-record-icon {
            width: 48px; height: 48px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .sf-record-icon svg { width: 28px; height: 28px; fill: white; }
        .sf-record-icon.account { background: #7f8de1; }
        .sf-record-icon.contract { background: #6ec06e; }
        .sf-record-icon.contact { background: #a094ed; }
        .sf-record-icon.opportunity { background: #fcb95b; }
        .sf-record-icon.default { background: #b0adab; }
        .sf-record-title { font-size: 1.25rem; font-weight: 700; color: #080707; line-height: 1.3; }
        .sf-record-subtitle { font-size: 0.75rem; color: #706e6b; }
        .sf-highlights { display: flex; gap: 2rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .sf-highlight-item { min-width: 100px; }
        .sf-highlight-item .sf-field-label { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.3px; }
        .sf-highlight-item .sf-field-value { font-size: 0.8125rem; }

        /* === Related lists === */
        .sf-related-card {
            background: white; border: 1px solid #e5e5e5;
            border-radius: 4px; margin-bottom: 0.75rem;
        }
        .sf-related-header {
            padding: 0.75rem; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #e5e5e5;
        }
        .sf-related-title { font-size: 0.875rem; font-weight: 700; color: #080707; }
        .sf-related-count { font-size: 0.75rem; color: #706e6b; font-weight: 400; margin-left: 0.375rem; }

        /* === Utilities === */
        .empty-state { text-align: center; padding: 3rem; color: #706e6b; }
        .layout-select {
            font-size: 0.75rem; color: #706e6b; margin-left: auto;
            display: flex; align-items: center; gap: 0.25rem;
        }
        .layout-select select {
            font-size: 0.75rem; border: 1px solid #dddbda; border-radius: 4px;
            padding: 2px 6px; color: #444746; background: white;
        }

        /* SLDS icon overrides for inline SVG */
        .slds-icon_container { display: inline-flex; align-items: center; justify-content: center; }
        .slds-icon_container svg.slds-icon { fill: currentColor; }
        .slds-icon_container[class*="slds-icon-standard-"] { border-radius: 6px; padding: 6px; }
        .slds-icon_container[class*="slds-icon-standard-"] svg.slds-icon { fill: white; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-container">
    <nav class="sf-global-nav">
        <a href="/" class="sf-nav-brand">emusf</a>
        <div class="sf-nav-items">
            {% for sobj, conf in sobject_config.items() %}
            <a href="/{{ sobj.lower() }}" class="sf-nav-item {% if request and request.path.startswith('/' + sobj.lower()) %}active{% endif %}">{{ conf.label }}s</a>
            {% endfor %}
            <a href="/objects" class="sf-nav-item" style="font-size:0.75rem; opacity:0.7;">Tous les objets</a>
        </div>
        <div class="sf-nav-search">
            <form method="GET" action="/search">
                <div class="sf-nav-search-wrap">
                    {{ slds_icon('utility', 'search', 'x-small', 'search-icon') }}
                    <input type="text" name="q" placeholder="Rechercher dans Salesforce...">
                </div>
            </form>
        </div>
    </nav>

    <div class="{% block page_class %}page-content{% endblock %}">
        {% block content %}{% endblock %}
    </div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
