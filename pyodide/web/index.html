<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMUSF — Émulateur Salesforce dans le navigateur</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
<style>
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --dim: #656d76;
    --cyan: #0969da;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --accent: #0969da;
    --accent-text: #ffffff;
    --input-bg: #ffffff;
    --tree-hover: #eaeef2;
    --tree-active: #ddf4ff;
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --cyan: #58d6ff;
    --green: #56d364;
    --yellow: #e3b341;
    --red: #ff7b72;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --input-bg: #0d1117;
    --tree-hover: #21262d;
    --tree-active: #0c2d6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 14px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header h1 .logo { color: var(--cyan); }
  header .subtitle { color: var(--dim); font-size: 12px; }
  header a { color: var(--cyan); text-decoration: none; }
  header a:hover { text-decoration: underline; }
  #status { font-size: 12px; color: var(--yellow); margin-left: auto; white-space: nowrap; }
  #status.ready { color: var(--green); }
  #status.error { color: var(--red); }
  #theme-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; font-size: 13px;
  }

  #app { flex: 1; display: flex; min-height: 0; }

  /* — Explorateur — */
  #sidebar {
    width: 240px; min-width: 180px; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--panel);
    padding: 8px 0; font-size: 13px;
  }
  #sidebar .section {
    padding: 6px 12px 2px; color: var(--dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  #sidebar .node {
    padding: 3px 12px; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #sidebar .node:hover { background: var(--tree-hover); }
  #sidebar .node.active { background: var(--tree-active); }
  #sidebar .node.file::before { content: "📄 "; }
  #sidebar .node.file.trigger::before { content: "⚡ "; }
  #sidebar .node.file.flow::before { content: "🔀 "; }
  #sidebar .folder-row { display: flex; align-items: center; }
  #sidebar .folder-row .node { flex: 1; }
  #sidebar .folder-row .node::before { content: "📁 "; }
  #sidebar .runscen {
    border: 1px solid var(--border); background: transparent; color: var(--green);
    border-radius: 6px; cursor: pointer; font-size: 11px; margin-right: 8px;
    padding: 1px 7px; font-family: inherit;
  }
  #sidebar .runscen:hover:enabled { border-color: var(--green); }
  #sidebar .indent { padding-left: 26px; }

  /* — Zone principale — */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #editor-pane { flex: 1.2; display: flex; flex-direction: column; min-height: 120px; }
  #editor-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
    font-size: 12px;
  }
  #editor-bar #filename { color: var(--cyan); }
  #editor-bar #dirty { color: var(--yellow); display: none; }
  #editor-bar .spacer { flex: 1; }
  #editor-bar label { color: var(--dim); }
  #method {
    width: 90px; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit;
    font-size: 12px; padding: 2px 6px;
  }
  button.action {
    background: var(--accent); color: var(--accent-text); border: none;
    border-radius: 6px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button.action.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.action:disabled { opacity: 0.4; cursor: default; }
  #editor {
    flex: 1; width: 100%; resize: none; border: none; outline: none;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 12px 16px; tab-size: 4; white-space: pre;
  }
  #editor:disabled { color: var(--dim); }

  /* — Fiche scénario — */
  #scenario-view { flex: 1; overflow-y: auto; padding: 18px 24px; display: none; }
  #scenario-view h2 { margin: 0 0 4px; font-size: 16px; }
  #scenario-view h2::before { content: "📁 "; }
  #scenario-view .desc {
    color: var(--text); font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; margin: 10px 0 18px; max-width: 72ch;
  }
  #scenario-view .desc code {
    background: var(--tree-hover); border-radius: 4px; padding: 0 4px;
  }
  #scenario-view .files-title {
    color: var(--dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 6px;
  }
  #scenario-view .frow {
    display: flex; gap: 12px; padding: 5px 8px; border-radius: 6px;
    cursor: pointer; font-size: 13px; align-items: baseline;
  }
  #scenario-view .frow:hover { background: var(--tree-hover); }
  #scenario-view .frow .fname { color: var(--cyan); min-width: 220px; }
  #scenario-view .frow .fkind { color: var(--dim); font-size: 12px; }
  #scenario-view .runbig {
    margin: 16px 0 0; background: var(--green); color: #fff; border: none;
    border-radius: 6px; padding: 8px 18px; font: inherit; font-size: 13px;
    cursor: pointer;
  }
  #scenario-view .runbig:disabled { opacity: 0.5; cursor: default; }

  /* — Console — */
  #console-pane {
    height: 42%; min-height: 140px; display: flex; flex-direction: column;
    border-top: 2px solid var(--border);
  }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px;
    border-bottom: 1px solid var(--border); background: var(--panel); align-items: center;
  }
  #toolbar .label { color: var(--dim); font-size: 12px; margin-right: 4px; }
  button.chip {
    background: transparent; border: 1px solid var(--border); color: var(--cyan);
    border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button.chip:hover:enabled { border-color: var(--cyan); }
  #terminal {
    flex: 1; overflow-y: auto; padding: 10px 16px;
    white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5;
  }
  .entry-input { color: var(--cyan); }
  .entry-input::before { content: "apex> "; color: var(--dim); }
  .entry-action { color: var(--dim); font-style: italic; }
  .entry-output { color: var(--text); }
  .entry-output.error { color: var(--red); }
  .entry-output.info { color: var(--dim); }
  .entry-output.banner { color: var(--green); }
  #inputbar {
    display: flex; border-top: 1px solid var(--border); background: var(--panel);
    padding: 8px 16px; gap: 10px; align-items: center;
  }
  #prompt { color: var(--cyan); }
  #input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 13px;
  }
  #loader { padding: 40px 20px; text-align: center; color: var(--dim); font-size: 13px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--cyan);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 720px) {
    #sidebar { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="logo">EMUSF</span> — émulateur Apex/SOQL</h1>
  <span class="subtitle">
    Salesforce local, 100 % dans votre navigateur (Pyodide + SQLite) —
    <a href="https://github.com/oliviergg/emusf" target="_blank" rel="noopener">GitHub</a>
  </span>
  <span id="status"><span class="spinner"></span>chargement de Pyodide…</span>
  <button id="theme-toggle" title="Basculer clair/sombre">🌙</button>
</header>

<div id="app">
  <aside id="sidebar" hidden></aside>

  <main id="main">
    <section id="editor-pane">
      <div id="editor-bar">
        <span id="filename" class="info">— choisissez un fichier à gauche —</span>
        <span id="dirty">● modifié</span>
        <span class="spacer"></span>
        <label for="method">méthode</label>
        <input id="method" value="run" spellcheck="false">
        <button class="action" id="runfile" disabled>▶ Exécuter</button>
        <button class="action secondary" id="save" disabled>Sauvegarder (⌘S)</button>
      </div>
      <textarea id="editor" spellcheck="false" disabled
        placeholder="Ouvrez une classe Apex, un trigger ou un fichier de scénario depuis l'explorateur…"></textarea>
      <div id="scenario-view"></div>
    </section>

    <section id="console-pane">
      <div id="toolbar" hidden>
        <span class="label">Exemples :</span>
        <button class="chip" data-cmd="SELECT Id, Name, Famille_de_compte__c FROM Account">SOQL simple</button>
        <button class="chip" data-cmd="SELECT Name, (SELECT LastName FROM Contacts) FROM Account WHERE Active__c = 1">Sous-requête</button>
        <button class="chip" data-cmd="System.debug('Hello depuis Apex ' + String.valueOf(2 + 2));">System.debug</button>
        <button class="chip" data-cmd="insert new Account(Name='Pyodide Corp', Active__c=1);">insert + trigger</button>
        <button class="chip" data-cmd="List&lt;Account&gt; accs = [SELECT Id, Name FROM Account]; for (Account a : accs) { System.debug(a.Name); }">Boucle for</button>
        <button class="chip" id="reset" style="color: var(--yellow)">Reset org</button>
      </div>
      <div id="terminal"><div id="loader">
        <span class="spinner"></span>Téléchargement de l'environnement Python (~15 Mo, une seule fois — ensuite en cache)…
      </div></div>
      <div id="inputbar" hidden>
        <span id="prompt">apex&gt;</span>
        <input id="input" autocomplete="off" spellcheck="false"
               placeholder="SOQL (SELECT …) ou Apex (System.debug('hi');) — /help pour l'aide">
        <button class="action" id="run">Exécuter</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  // — Thème (clair par défaut) —
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("emusf-theme", theme); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem("emusf-theme"); } catch (e) {}
  applyTheme(saved === "dark" ? "dark" : "light");
  themeBtn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // Distribution Pyodide : le CDN par défaut, ou ?pyodide=<url> (tests locaux).
  // v314 = Python 3.14, dont la stdlib inclut sqlite3 (utilisé par le shim
  // psycopg2 d'emusf — aucune extension à télécharger en plus).
  var params = new URLSearchParams(location.search);
  var INDEX_URL = params.get("pyodide") ||
      "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/";
  if (!INDEX_URL.endsWith("/")) INDEX_URL += "/";

  // Identifiant de build injecté par build.py (hash du bundle) — versionne
  // l'URL du zip pour que page et bundle ne se désynchronisent jamais en cache
  var BUILD = "__EMUSF_BUILD__";

  var terminal = document.getElementById("terminal");
  var statusEl = document.getElementById("status");
  var inputEl = document.getElementById("input");
  var editorEl = document.getElementById("editor");
  var scenarioView = document.getElementById("scenario-view");
  var filenameEl = document.getElementById("filename");
  var dirtyEl = document.getElementById("dirty");
  var saveBtn = document.getElementById("save");
  var runFileBtn = document.getElementById("runfile");
  var methodEl = document.getElementById("method");
  var history = [];
  var historyIdx = -1;
  var pyodideRef = null;
  var mod = null;               // module python emusf_web
  var currentFile = null;
  var dirty = false;

  function setStatus(text, cls) {
    statusEl.className = cls || "";
    statusEl.innerHTML = (cls ? "" : '<span class="spinner"></span>') + text;
  }

  function append(text, cls) {
    if (text === null || text === undefined || text === "") return;
    var div = document.createElement("div");
    div.className = cls;
    div.textContent = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function appendResult(out) {
    var isError = out && (out.indexOf("ERREUR") === 0 || out.indexOf("\nERREUR") >= 0 ||
                          out.indexOf("ÉCHEC") >= 0);
    append(out || "(aucune sortie)", "entry-output" + (isError ? " error" : ""));
  }

  // — REPL —

  function execute(cmd) {
    cmd = (cmd || "").trim();
    if (!cmd || !mod) return;
    append(cmd, "entry-input");
    history.push(cmd);
    historyIdx = history.length;
    try {
      appendResult(mod.run_line(cmd));
    } catch (e) {
      append(String(e), "entry-output error");
    }
    inputEl.value = "";
    inputEl.focus();
  }

  // — Éditeur —

  function setDirty(v) {
    dirty = v;
    dirtyEl.style.display = v ? "inline" : "none";
    saveBtn.disabled = !v || !currentFile;
  }

  function markActive(nodeEl) {
    document.querySelectorAll("#sidebar .node.active").forEach(function (n) {
      n.classList.remove("active");
    });
    if (nodeEl) nodeEl.classList.add("active");
  }

  function openFile(path, nodeEl) {
    if (!mod) return;
    if (dirty && currentFile &&
        !confirm("Modifications non sauvegardées sur " + currentFile + " — les abandonner ?")) {
      return;
    }
    try {
      var content = mod.read_file(path);
    } catch (e) {
      append(String(e), "entry-output error");
      return;
    }
    scenarioView.style.display = "none";
    editorEl.style.display = "";
    currentFile = path;
    editorEl.value = content;
    editorEl.disabled = false;
    filenameEl.textContent = path;
    setDirty(false);
    runFileBtn.disabled = !path.endsWith(".cls");
    markActive(nodeEl);
  }

  // — Fiche de présentation d'un scénario —

  // Mini-rendu du README : échappe le HTML puis `code` et **gras**
  function renderDesc(text) {
    var esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function showScenario(name, nodeEl) {
    if (!mod) return;
    var info;
    try {
      info = JSON.parse(mod.scenario_info(name));
    } catch (e) {
      append(String(e), "entry-output error");
      return;
    }
    editorEl.style.display = "none";
    scenarioView.style.display = "block";
    currentFile = null;
    filenameEl.textContent = "scénario " + name;
    setDirty(false);
    runFileBtn.disabled = true;
    markActive(nodeEl);

    var desc = info.description || "(pas de README.md dans ce scénario)";
    var title = name;
    var m = desc.match(/^#\s+(.+)\n?/);
    if (m) {
      title = m[1];
      desc = desc.slice(m[0].length).trim();
    }
    scenarioView.innerHTML = "";
    var h = document.createElement("h2");
    h.textContent = title;
    scenarioView.appendChild(h);
    var d = document.createElement("div");
    d.className = "desc";
    d.innerHTML = renderDesc(desc);
    scenarioView.appendChild(d);
    var ft = document.createElement("div");
    ft.className = "files-title";
    ft.textContent = "Fichiers du scénario";
    scenarioView.appendChild(ft);
    info.files.forEach(function (f) {
      var row = document.createElement("div");
      row.className = "frow";
      var fn = document.createElement("span");
      fn.className = "fname";
      fn.textContent = "📄 " + f.name;
      var fk = document.createElement("span");
      fk.className = "fkind";
      fk.textContent = f.kind;
      row.appendChild(fn);
      row.appendChild(fk);
      row.addEventListener("click", function () { openFile(f.path, null); });
      scenarioView.appendChild(row);
    });
    var runBig = document.createElement("button");
    runBig.className = "runbig";
    runBig.textContent = "▶ Exécuter le scénario";
    runBig.addEventListener("click", function () { runScenario(name, runBig); });
    scenarioView.appendChild(runBig);
  }

  function saveFile() {
    if (!mod || !currentFile || !dirty) return;
    try {
      var msg = mod.write_file(currentFile, editorEl.value);
      setDirty(false);
      append(msg, "entry-output info");
    } catch (e) {
      append(String(e), "entry-output error");
    }
  }

  function runCurrentFile() {
    if (!mod || !currentFile || !currentFile.endsWith(".cls")) return;
    if (dirty) saveFile();
    var method = (methodEl.value || "run").trim();
    append("exécution de " + currentFile + " → " + method + "()", "entry-action");
    try {
      appendResult(mod.run_class(currentFile, method));
    } catch (e) {
      append(String(e), "entry-output error");
    }
  }

  // — Scénarios —

  async function runScenario(name, btn) {
    if (!mod) return;
    if (dirty && currentFile) saveFile();
    btn.disabled = true;
    append("scénario " + name + " (classes + triggers + flows, org dédiée)", "entry-action");
    try {
      appendResult(mod.run_scenario(name));
    } catch (e) {
      append(String(e), "entry-output error");
    } finally {
      btn.disabled = false;
      terminal.scrollTop = terminal.scrollHeight;
    }
  }

  // — Explorateur —

  function fileNode(path, indent) {
    var div = document.createElement("div");
    div.className = "node file" + (indent ? " indent" : "");
    if (path.endsWith(".trigger")) div.classList.add("trigger");
    if (path.indexOf("flow-meta") >= 0) div.classList.add("flow");
    div.textContent = path.split("/").pop();
    div.title = path;
    div.addEventListener("click", function () { openFile(path, div); });
    return div;
  }

  function buildTree(tree) {
    var sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = "";

    var s1 = document.createElement("div");
    s1.className = "section";
    s1.textContent = "Apex (bac à sable)";
    sidebar.appendChild(s1);
    tree.apex.forEach(function (path) { sidebar.appendChild(fileNode(path, false)); });

    var scenNames = Object.keys(tree.scenarios);
    if (scenNames.length) {
      var s2 = document.createElement("div");
      s2.className = "section";
      s2.textContent = "Scénarios";
      sidebar.appendChild(s2);
      scenNames.forEach(function (name) {
        var row = document.createElement("div");
        row.className = "folder-row";
        var folder = document.createElement("div");
        folder.className = "node";
        folder.textContent = name;
        var runBtn = document.createElement("button");
        runBtn.className = "runscen";
        runBtn.textContent = "▶";
        runBtn.title = "Exécuter le scénario " + name;
        runBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          runScenario(name, runBtn);
        });
        row.appendChild(folder);
        row.appendChild(runBtn);
        sidebar.appendChild(row);

        var children = document.createElement("div");
        tree.scenarios[name].forEach(function (path) {
          children.appendChild(fileNode(path, true));
        });
        sidebar.appendChild(children);
        folder.addEventListener("click", function () {
          showScenario(name, folder);
        });
      });
    }
    sidebar.hidden = false;
  }

  // — Boot —

  async function boot() {
    try {
      await new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = INDEX_URL + "pyodide.js";
        s.onload = resolve;
        s.onerror = function () { reject(new Error("impossible de charger " + s.src)); };
        document.head.appendChild(s);
      });

      var pyodide = await loadPyodide({ indexURL: INDEX_URL });
      pyodideRef = pyodide;
      setStatus("chargement d'EMUSF…");

      var resp = await fetch("emusf_bundle.zip?v=" + BUILD, { cache: "no-cache" });
      if (!resp.ok) throw new Error("emusf_bundle.zip introuvable (" + resp.status + ")");
      var buf = await resp.arrayBuffer();
      pyodide.unpackArchive(buf, "zip", { extractDir: "/emusf_app" });

      var banner = await pyodide.runPythonAsync(
        'import sys\n' +
        'sys.path.insert(0, "/emusf_app")\n' +
        'sys.setrecursionlimit(2500)\n' +
        'import emusf_web\n' +
        'emusf_web.init()\n');

      mod = pyodide.pyimport("emusf_web");
      if (typeof mod.list_tree !== "function") {
        throw new Error("bundle EMUSF obsolète (cache navigateur) — " +
                        "rechargez la page en forçant (⇧⌘R / Ctrl+F5)");
      }
      buildTree(JSON.parse(mod.list_tree()));

      document.getElementById("loader").remove();
      document.getElementById("toolbar").hidden = false;
      document.getElementById("inputbar").hidden = false;
      setStatus("prêt — " + pyodide.version, "ready");
      statusEl.title = "build " + BUILD;

      append("EMUSF REPL — " + banner, "entry-output banner");
      append("Tapez du SOQL (SELECT …) ou de l'Apex ci-dessous, ou ouvrez un fichier "
             + "dans l'explorateur pour le modifier et l'exécuter.\n", "entry-output info");
      inputEl.focus();
    } catch (e) {
      console.error(e);
      setStatus("échec du chargement", "error");
      append("Échec du chargement : " + e.message, "entry-output error");
      append("Vérifiez votre connexion (le CDN jsdelivr doit être accessible) puis rechargez la page.", "entry-output info");
    }
  }

  // — Événements —

  document.getElementById("run").addEventListener("click", function () { execute(inputEl.value); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      execute(inputEl.value);
    } else if (e.key === "ArrowUp") {
      if (historyIdx > 0) { historyIdx -= 1; inputEl.value = history[historyIdx]; e.preventDefault(); }
    } else if (e.key === "ArrowDown") {
      if (historyIdx < history.length - 1) { historyIdx += 1; inputEl.value = history[historyIdx]; }
      else { historyIdx = history.length; inputEl.value = ""; }
      e.preventDefault();
    }
  });

  editorEl.addEventListener("input", function () { setDirty(true); });
  saveBtn.addEventListener("click", saveFile);
  runFileBtn.addEventListener("click", runCurrentFile);
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "s") {
      e.preventDefault();
      saveFile();
    }
  });

  document.querySelectorAll("button.chip[data-cmd]").forEach(function (btn) {
    btn.addEventListener("click", function () { execute(btn.getAttribute("data-cmd")); });
  });

  document.getElementById("reset").addEventListener("click", function () {
    if (!mod) return;
    try {
      append("Org réinitialisée — " + mod.reset(), "entry-output banner");
    } catch (e) {
      append(String(e), "entry-output error");
    }
  });

  boot();
})();
</script>
</body>
</html>
